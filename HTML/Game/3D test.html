<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Canvas 2D 게임 입문</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            border: 3px solid #fff;
            background-color: #111;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    // 1. Canvas 및 2D 컨텍스트 설정
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 2. 플레이어 객체 (초기 위치, 크기, 속도)
    const player = {
        x: 180,
        y: 530,
        width: 40,
        height: 40,
        speed: 5
    };

    // 3. 떨어지는 장애물 객체
    const enemy = {
        x: Math.random() * (canvas.width - 30),
        y: 0,
        width: 30,
        height: 30,
        speed: 4
    };

    let score = 0;
    let gameOver = false;

    // 4. 키보드 입력 상태 저장
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    // 5. 두 네모의 충돌 판정 함수 (AABB 충돌 알고리즘)
    function checkCollision(rect1, rect2) {
        return (
            rect1.x < rect2.x + rect2.width &&
            rect1.x + rect1.width > rect2.x &&
            rect1.y < rect2.y + rect2.height &&
            rect1.y + rect1.height > rect2.y
        );
    }

    // 6. 메인 게임 루프 (초당 60회 반복 실행)
    function gameLoop() {
        if (gameOver) return;

        // A. 위치 및 상태 업데이트 (Update)
        if (keys['ArrowLeft'] && player.x > 0) {
            player.x -= player.speed;
        }
        if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
            player.x += player.speed;
        }

        // 장애물 아래로 이동
        enemy.y += enemy.speed;

        // 장애물이 바닥에 닿으면 다시 위에서 생성
        if (enemy.y > canvas.height) {
            enemy.y = -30;
            enemy.x = Math.random() * (canvas.width - enemy.width);
            enemy.speed += 0.2; // 난이도 상승
            score += 10;
        }

        // 충돌 검사
        if (checkCollision(player, enemy)) {
            gameOver = true;
            alert(`게임 오버! 최종 점수: ${score}점`);
            location.reload(); // 페이지 새로고침으로 재시작
        }

        // B. 화면 렌더링 (Draw)
        ctx.clearRect(0, 0, canvas.width, canvas.height); // 이전 잔상 지우기

        // 플레이어 그리기 (파란색 네모)
        ctx.fillStyle = '#00fff5';
        ctx.fillRect(player.x, player.y, player.width, player.height);

        // 장애물 그리기 (빨간색 네모)
        ctx.fillStyle = '#ff4d4d';
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

        // 점수 텍스트 그리기
        ctx.fillStyle = '#ffffff';
        ctx.font = '20px sans-serif';
        ctx.fillText(`Score: ${score}`, 15, 30);

        // 다음 프레임 요청
        requestAnimationFrame(gameLoop);
    }

    // 게임 시작
    gameLoop();
</script>

</body>
</html>
